services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banco-backend
    environment:
      - DB_URL=${DB_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ORIGINS=${ORIGINS}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - banco-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: banco-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - banco-net

volumes:
  postgres_data:

networks:
  banco-net: